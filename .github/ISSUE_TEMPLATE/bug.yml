name: Bug report
description: Report a reproducible DSH Live Voice failure without exposing private data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Never include credentials, recordings, private transcripts, workspace content, personal data, or identifying logs.
  - type: input
    id: voice-version
    attributes:
      label: DSH Live Voice version
      description: Use an exact release tag or commit SHA.
      placeholder: v0.3.0-preview.3
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      placeholder: dsh-v0.1.1-rc.2 or an exact commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, architecture, DSH profile, browser or Desktop version, and installation method.
      placeholder: Windows 11 x64; web profile; Chrome 151; installed from the GitHub release tag
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List exact steps, starting from a clean or clearly described state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Paste the smallest useful error or trace after removing secrets, private content, and identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, recordings, private transcripts, workspace content, personal data, and identifying logs.
          required: true
        - label: I searched existing issues and did not find the same reproduction.
          required: true
