name: Exact-alpha authenticated Web proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out immutable DSH Live Voice preview.3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Jstn-1g/dsh-live-voice
          ref: 10bd8bf504cf17fb24523f2c18e9f8a586a41167 # v0.3.0-preview.3
          path: plugin
          persist-credentials: false

      - name: Check out exact DSH alpha source and tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: cd5ef8148158c3a752a658978873241fdf8e2bbc # dsh-v0.1.2-alpha.1
          path: harness
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm 11.7.0
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node 24.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: |
            plugin/pnpm-lock.yaml
            harness/pnpm-lock.yaml

      - name: Install plugin dependencies from the frozen lockfile
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Install exact-alpha dependencies from the frozen lockfile
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Run the complete plugin check
        working-directory: plugin
        run: pnpm run check

      - name: Build the exact official Harness profile
        working-directory: harness
        run: pnpm run build:official

      - name: Run the authenticated fake-provider composition
        working-directory: plugin
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
          DSH_VOICE_SMOKE_INSTALL_ONLINE: '1'
        run: pnpm run smoke:harness:alpha-auth
