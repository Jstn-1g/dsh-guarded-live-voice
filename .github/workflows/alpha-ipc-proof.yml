name: Exact-alpha IPC-equivalent proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out DSH Live Voice
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: plugin
          persist-credentials: false

      - name: Check out exact DSH alpha source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: cd5ef8148158c3a752a658978873241fdf8e2bbc
          path: harness
          persist-credentials: false

      - name: Set up pnpm 11.7.0
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node 24.12.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: |
            plugin/pnpm-lock.yaml
            harness/pnpm-lock.yaml

      - name: Install plugin dependencies from the frozen lockfile
        working-directory: plugin
        run: pnpm install --frozen-lockfile

      - name: Install exact-alpha dependencies from the frozen lockfile
        working-directory: harness
        run: pnpm install --frozen-lockfile

      - name: Build exact-alpha workspace libraries
        working-directory: harness
        run: pnpm run build:lib

      - name: Run the exact-alpha structured-clone proof
        working-directory: plugin
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
          DSH_LIVE_VOICE_DEPENDENCY_PROVENANCE: fresh-frozen-lockfile
        run: pnpm run smoke:harness:alpha-ipc
